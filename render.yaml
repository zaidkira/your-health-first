services:
  - type: web
    name: your-health-first
    env: node
    buildCommand: npm install pnpm@9 && npx pnpm@9 install --no-frozen-lockfile && npx pnpm@9 run build
    startCommand: cd artifacts/api-server && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: "/"
      - key: DATABASE_URL
        sync: false
